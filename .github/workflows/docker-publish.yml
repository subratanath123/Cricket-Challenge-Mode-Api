name: Build, push, and deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: chmod +x gradlew && ./gradlew test --no-daemon

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/howzat-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/howzat-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Pull image and restart on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 2765
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            USERNAME=$(grep '^DOCKERHUB_USERNAME=' .env | cut -d= -f2- | tr -d '\"' | tr -d "'")
            TOKEN=$(grep '^DOCKERHUB_TOKEN=' .env | cut -d= -f2- | tr -d '\"' | tr -d "'")
            if [ -n "${TOKEN:-}" ] && [ "$TOKEN" != "your-dockerhub-access-token" ]; then
              echo "$TOKEN" | docker login -u "$USERNAME" --password-stdin
            fi
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker image prune -f
